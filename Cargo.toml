[package]
name = "ini-as-rest"
version = "0.1.0"
edition = "2021"


[dependencies]
rust-ini = "0.18.0"
serde = "1.0.137"
dirs = "4.0.0"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-credential-types = "1"
tokio = { version = "1", features = ["rt", "macros"] }
log = "0.4"
env_logger = "0.11"

[dependencies.clap]
version = "3.1.18"
features = ["derive"]

[dependencies.rocket]
version = "0.5.0-rc.2"
features = ["json"]
